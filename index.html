<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobImp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<style>
/* Same calm dark theme as the mobile mockup, laid out for a wide screen: sidebar, content, agent always on the right. */
:root{
  --bg:#0F0F11; --side:#0B0B0D; --surface:#17171A; --surface2:#202024; --line:rgba(255,255,255,.07);
  --ink:#EDEDEF; --muted:rgba(237,237,239,.56); --faint:rgba(237,237,239,.34);
  --accent:#B4BCFF; --accent-ink:#0F0F11;
  --s-applied:#9DB4F5; --s-interview:#E3B66B; --s-offer:#8FD3AC; --s-closed:#E39A9A;
  --f:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; --h:"Plus Jakarta Sans",var(--f);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16.1px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;letter-spacing:inherit;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:256px minmax(0,1fr) 420px;height:100vh;height:100dvh}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;min-height:0}
.logo{font-family:var(--h);font-weight:700;font-size:21.8px;letter-spacing:-.03em;padding:0 10px 22px}
.logo span{color:var(--accent)}
.navl{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--muted);font-size:15.5px;text-align:left;width:100%}
.nv:hover{background:var(--surface)}
.nv.on{background:var(--surface);color:var(--ink)}
.nv .ct{margin-left:auto;font-size:13.2px;color:var(--faint);font-variant-numeric:tabular-nums}
.nv .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sideh{font-size:12.6px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;padding:26px 10px 8px}
.sjobs{overflow-y:auto;flex:1;min-height:0;scrollbar-width:none}
.sj{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;width:100%;text-align:left;font-size:14.9px;color:var(--muted)}
.sj:hover{background:var(--surface)}
.sj.on{background:var(--surface);color:var(--ink)}
.sj .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sj .st{font-size:0;gap:0}
.me{display:flex;align-items:center;gap:10px;padding:14px 10px 0;border-top:1px solid var(--line);font-size:14.9px;color:var(--muted)}
.wa{margin-left:auto;font-size:12.6px;color:var(--s-offer)}

/* main */
.main{overflow-y:auto;min-width:0;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
.wrap{max-width:980px;margin:0 auto;padding:34px 48px 80px}
.wrap.wide{max-width:none}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:22px;min-height:34px}
.ph h1{font-family:var(--h);font-weight:700;font-size:27.6px;letter-spacing:-.03em;margin:0;flex:1}
.ph .sub{font-size:14.4px;color:var(--muted)}
.seg{display:flex;background:var(--surface);border-radius:9px;padding:3px}
.seg button{padding:5px 12px;border-radius:7px;font-size:14.4px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--surface2);color:var(--ink)}
.seg svg.i{width:15px;height:15px}

/* shared */
.lbl{font-size:13.2px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;margin:30px 0 6px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:15px 10px;margin:0 -10px;width:calc(100% + 20px);text-align:left;border-bottom:1px solid var(--line);border-radius:0}
.row:last-child{border-bottom:0}
button.row:hover,.row.hov:hover{background:rgba(255,255,255,.025)}
.row .txt{flex:1;min-width:0}
.t1{font-size:16.7px;font-weight:500;line-height:1.3}
.t2{font-size:14.4px;color:var(--muted);margin-top:2px;line-height:1.35}
.t3{font-size:13.2px;color:var(--faint);margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chev{color:var(--faint);font-size:18.4px}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:14.9px;font-weight:500;flex:none}
.av.sm{width:24px;height:24px;font-size:12.6px}
.av.lg{width:52px;height:52px;font-size:21.8px}
.src{font-size:12.1px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:13.2px;color:var(--muted)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.st.applied::before,.st.tag-applied::before{background:var(--s-applied)}
.st.interview::before,.st.tag-reposted::before{background:var(--s-interview)}
.st.offer::before,.st.tag-new::before{background:var(--s-offer)}
.st.closed::before{background:var(--s-closed)}
.tabsline{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabsline button{white-space:nowrap;font-family:var(--h);font-weight:600;font-size:14.9px;color:var(--faint);padding:8px 0 10px;border-bottom:1.5px solid transparent;margin-bottom:-1px}
.tabsline button:hover{color:var(--muted)}
.tabsline button.on{color:var(--ink);border-color:var(--ink)}
.tabsline .n{margin-left:5px;font-size:13.2px;color:var(--faint)}
.link{color:var(--accent);font-size:14.9px}
.empty{text-align:center;color:var(--faint);padding:60px 10px;font-size:14.9px}
.note{font-size:13.2px;color:var(--faint);margin:12px 0 2px}
.mini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);flex:none}
.mini svg.i{width:15px;height:15px}
.sbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);flex:none}
.sbtn:hover{color:var(--ink)}
.sbtn.add{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.sbtn svg.i{width:15px;height:15px;stroke-width:2}
.ask{font-size:13.8px;color:var(--accent);opacity:0;transition:opacity .15s}
.row:hover .ask,.kc:hover .ask{opacity:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);background:var(--surface2);padding:9px 16px;border-radius:99px;font-size:14.9px;z-index:90;opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 0 0 1px var(--line)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* today */
.hero .d{font-size:13.8px;color:var(--faint)}
.hero h2{font-size:34.5px;font-weight:400;letter-spacing:-.025em;margin:8px 0 4px;line-height:1.25}
.hero p{margin:0;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:30px}
.kpi{padding:16px 0 16px 18px}
.kpi:first-child{padding-left:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi .l{font-size:13.2px;color:var(--faint)}
.kpi .v{font-size:29.9px;font-weight:300;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13.2px;color:var(--muted)}

/* found */
.prefs{display:flex;align-items:center;gap:12px;font-size:14.4px;color:var(--muted);margin:0 0 16px}
.jr{transition:opacity .25s}
.jr.gone{opacity:0}
.jr .meta{width:120px;flex:none;font-size:13.8px;color:var(--faint);display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.jr .acts2{display:flex;gap:8px;flex:none}
.warn{font-size:13.8px;color:var(--s-interview);margin-top:5px}

/* jobs */
.days{text-align:right;flex:none;width:64px}
.days .n{font-size:17.2px;font-weight:500;font-variant-numeric:tabular-nums}
.days .l{font-size:12.1px;color:var(--faint)}
.days.hot .n{color:var(--s-interview)}
.next{font-size:13.8px;color:var(--s-interview);margin-top:3px}
.cols{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h4{margin:0 0 6px;font-size:13.8px;font-weight:500;display:flex;align-items:center}
.col h4 .c{color:var(--faint);margin-left:6px;font-weight:400}
.kc{background:var(--surface);border-radius:12px;padding:13px;text-align:left;width:100%;transition:background .15s}
.kc:hover{background:var(--surface2)}
.kc .co{font-size:15.5px;font-weight:500}
.kc .rl{font-size:13.8px;color:var(--muted);margin-top:2px;line-height:1.35}
.kc .ft{display:flex;justify-content:space-between;font-size:12.6px;color:var(--faint);margin-top:12px}
.kempty{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;font-size:13.8px;color:var(--faint)}

/* job page */
.back{color:var(--muted);font-size:14.9px;margin:0 0 22px}
.back:hover{color:var(--ink)}
.dh{display:flex;gap:16px;align-items:center}
.dh h2{margin:0;font-size:25.3px;font-weight:500;letter-spacing:-.02em}
.count{font-size:14.9px;color:var(--muted)}
.count b{font-size:34.5px;font-weight:300;color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
.tl .row{padding:10px}
.tl .d{width:60px;flex:none;color:var(--faint);font-size:13.8px}
.tl .x{font-size:15.5px;color:var(--muted)}
.nudge{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:16px;font-size:15.5px;line-height:1.5;color:var(--muted)}
.nudge:hover{background:var(--surface2)}
.nudge .txt{flex:1}
.nudge .more{color:var(--accent);margin-top:6px;font-size:14.9px}

/* where you stand */
.wt{padding:11px 0}
.wh{display:flex;justify-content:space-between;font-size:14.9px;margin-bottom:9px}
.ws.over{color:var(--s-interview)} .ws.done{color:var(--s-offer)}
.track{position:relative;height:6px;border-radius:3px;background:var(--surface2)}
.track .band{position:absolute;top:0;bottom:0;border-radius:3px;background:color-mix(in srgb,var(--accent) 32%,transparent)}
.track .you{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--bg)}
.track .you.over{background:var(--s-interview)} .track .you.done{background:var(--s-offer)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:8px}
.legend{display:flex;gap:14px;font-size:12.1px;color:var(--faint);margin:2px 0 4px;align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.foot{font-size:12.6px;color:var(--faint);margin:20px 0 0}

/* interviews */
.recbox{background:var(--surface);border-radius:18px;padding:30px 24px;display:flex;flex-direction:column;align-items:center}
.recopts{display:flex;gap:14px;align-items:center;font-size:14.4px;color:var(--muted)}
.recopts select{font:inherit;background:transparent;color:var(--ink);border:0;font-size:14.9px}
.recopts select option{background:var(--surface)}
.recopts button{color:var(--faint)} .recopts button.on{color:var(--ink)}
.timer{font-weight:300;font-size:46px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:24px 0 8px}
.wave{display:flex;gap:3px;align-items:center;height:26px}
.wave i{width:2px;border-radius:1px;background:var(--faint);height:3px}
.wave.on i{animation:w .9s ease-in-out infinite;background:var(--ink)}
@keyframes w{0%,100%{height:3px}50%{height:22px}}
.recbtn{position:relative;width:80px;height:80px;border-radius:50%;margin:26px 0 12px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#2A2A31,#141417 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px var(--line),0 20px 44px -14px rgba(229,72,77,.4)}
.recbtn.on{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.35)}100%{box-shadow:0 0 0 22px rgba(229,72,77,0)}}
.recbtn i{width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#FF7070,#E5484D);box-shadow:0 0 22px rgba(229,72,77,.55);transition:all .3s}
.recbtn.on i{width:22px;height:22px;border-radius:7px}
.reclbl{font-size:13.8px;color:var(--muted);margin-bottom:10px}
.reclbl.on{color:#FF7070}
.consent{font-size:13.2px;color:var(--faint);text-align:center}
.score{font-size:17.2px;font-weight:500;font-variant-numeric:tabular-nums}

/* stats */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--faint);font-size:11.5px;font-family:var(--f)}
svg.chart .grid{stroke:var(--line)}
svg.chart .bar{fill:var(--accent);opacity:.85}
svg.chart .bar:hover{opacity:1}
svg.chart .vl{fill:var(--ink);font-size:12.6px}

/* agent panel */
.agent{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.abar{display:flex;align-items:center;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line);min-height:72px}
.abar .txt{flex:1;min-width:0}
.abar .home{font-size:14.4px;color:var(--muted)}
.abar .home:hover{color:var(--ink)}
.spark{color:var(--accent)}
.msgs{flex:1;overflow-y:auto;padding:18px 22px 10px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.msgs>*{flex-shrink:0}
.msg{max-width:90%;line-height:1.55;font-size:15.5px}
.msg.me{align-self:flex-end;background:var(--surface2);padding:8px 14px;border-radius:18px}
.msg.bot{align-self:stretch;max-width:100%}
.acts{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;align-items:center}
.act{font-size:14.9px;color:var(--accent)}
.act.pri{color:var(--accent-ink);background:var(--accent);padding:5px 12px;border-radius:99px}
.draft{margin-top:10px;background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14.9px;white-space:pre-line;color:var(--muted);line-height:1.55}
.typing{display:flex;gap:4px;padding:6px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--faint);animation:b 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 22px 10px}
.sugg button{text-align:left;padding:9px 12px;border-radius:10px;background:var(--surface);color:var(--muted);font-size:14.4px;line-height:1.35}
.sugg button:hover{color:var(--ink);background:var(--surface2)}
.composer{display:flex;gap:8px;padding:6px 18px 20px;align-items:center}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:22px;padding:11px 16px;font:inherit;font-size:15.5px}
.composer input::placeholder{color:var(--faint)}
.sendb{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.sendb svg.i{width:16px;height:16px;stroke-width:2.2}
.micb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--faint);flex:none}
.micb:hover{color:var(--ink)}
.micb.rec{color:var(--s-closed)}
.kbd{font-size:12.1px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;width:min(560px,calc(100vw - 32px));max-height:min(760px,calc(100vh - 64px));transform:translate(-50%,-48%);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.9,.3,1);background:var(--bg);border-radius:18px;box-shadow:0 0 0 1px var(--line),0 40px 90px -20px rgba(0,0,0,.9);z-index:51;display:flex;flex-direction:column}
.modal.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.mbar{display:flex;align-items:center;padding:20px 26px 10px}
.mbar .t1{flex:1;font-size:19.5px}
.done{color:var(--muted);font-size:14.9px}
.done:hover{color:var(--ink)}
.mbody{overflow-y:auto;padding:0 26px 26px;scrollbar-width:none}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metric{padding:14px 0}
.metric+.metric{padding-left:14px;border-left:1px solid var(--line)}
.metric .l{font-size:12.6px;color:var(--faint)}
.metric .v{font-size:23px;margin-top:2px}
.metric .h{font-size:12.6px;color:var(--muted);margin-top:2px}
.ins{padding:10px 0;font-size:15.5px;line-height:1.5;color:var(--muted);border-bottom:1px solid var(--line)}
.qlist{margin:0;padding-left:18px;font-size:15.5px;line-height:1.9;color:var(--muted)}
.loading{text-align:center;padding:70px 0;color:var(--faint);font-size:14.9px}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface2);border-top-color:var(--muted);margin:0 auto 14px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.pbtn{display:inline-block;text-align:center;padding:10px 16px;border-radius:10px;font-size:15.5px;background:var(--surface)}
.pbtn.pri{background:var(--accent);color:var(--accent-ink);font-weight:500}

/* agent toggle for mid-size screens */
.atoggle{display:none;position:fixed;right:22px;bottom:22px;z-index:40;height:44px;padding:0 18px 0 14px;border-radius:99px;background:var(--surface2);color:var(--ink);align-items:center;gap:8px;box-shadow:0 0 0 1px var(--line),0 12px 30px -10px rgba(0,0,0,.8);font-size:14.9px}
.atoggle .spark{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.anim{animation:fadeIn .22s ease-out}
@media (max-width:1240px){
  .app{grid-template-columns:236px minmax(0,1fr)}
  .agent{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;z-index:45;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:-20px 0 60px -20px rgba(0,0,0,.8)}
  .agent.open{transform:none}
  .atoggle{display:flex}
  .agent .closeA{display:block}
}
.closeA{display:none}
@media (max-width:760px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .side{flex-direction:row;align-items:center;padding:10px 16px;gap:8px;position:sticky;top:0;z-index:30;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .logo{padding:0 8px 0 0}
  .navl{flex-direction:row}
  .nv{white-space:nowrap;padding:6px 10px}
  .nv .ct,.nv .dot,.nv svg.i{display:none}
  .sideh,.sjobs,.me{display:none}
  .main{overflow:visible}
  .wrap{padding:22px 16px 90px}
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){padding-left:0;border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .jr .meta{display:none}
  .hero h2{font-size:27.6px}
}


/* visual timeline */
.tlh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.seg.sm{margin-bottom:4px}.seg.sm button{padding:3px 10px;font-size:13.2px}
.vtl{position:relative;padding:10px 0 4px 26px}
.vtl::before{content:"";position:absolute;left:5px;top:18px;bottom:14px;width:1.5px;background:var(--surface2)}
.ve{position:relative;display:flex;gap:14px;align-items:baseline;min-height:22px}
.ve i{position:absolute;left:-26px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.ve.fut i{background:var(--bg);border:1.5px solid var(--s-interview)}
.ve.bad i{background:var(--s-closed)}
.ve.today i{background:var(--ink);width:7px;height:7px;left:-24px;top:7px}
.ve.today .vd{color:var(--ink)}
.ve .vd{width:56px;flex:none;font-size:13.8px;color:var(--faint)}
.ve .vx{font-size:15.5px;color:var(--muted)}
.ve.fut .vx{color:var(--s-interview)}
.vg{position:relative;display:flex;align-items:center}
.vg span{font-size:11.5px;color:var(--faint);margin-left:70px}


/* remove job */
.del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--faint);opacity:0;transition:opacity .15s}
.list button.row,.kc{position:relative}
.kc .co{padding-right:22px}
.del svg.i{width:14px;height:14px}
.del:hover{color:var(--s-closed);background:var(--surface)}
.row:hover .del,.kc:hover .del,.del:focus-visible{opacity:1}
.dh .sbtn:hover{color:var(--s-closed)}
.toast.act{pointer-events:auto}
.toast .link{font-size:inherit;margin-left:8px}
@media (hover:none){.del{opacity:1}}


/* drag and drop + bookmark */
[data-drag]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ghost{position:fixed;left:0;top:0;z-index:95;pointer-events:none;opacity:.92;box-shadow:0 18px 40px -12px rgba(0,0,0,.8),0 0 0 1px var(--line);background:var(--surface2)!important;border-radius:12px;margin:0!important}
.dragging{opacity:.35}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
.col{border-radius:14px;transition:background .15s,box-shadow .15s;padding:4px;margin:-4px}
.col.drop-on{background:color-mix(in srgb,var(--accent) 9%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 50%,transparent)}
.tabsline button.drop-on{color:var(--accent);border-color:var(--accent)}
.bm{display:inline-flex;align-items:center;vertical-align:-3px}
.bm svg.i{width:17px;height:17px}
.col h4 .bm{color:var(--muted)}

/* login */
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px 16px}
.lbox{width:min(420px,100%)}
.lbox .logo{padding:0 0 28px;font-size:27px}
.lbox h1{font-family:var(--h);font-weight:700;font-size:23px;letter-spacing:-.02em;margin:0 0 6px}
.lbox p{margin:0 0 26px;color:var(--muted);font-size:15px}
.acc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:14px;background:var(--surface);margin-bottom:10px}
.acc:hover{background:var(--surface2)}
.acc .txt{flex:1}
.pw{display:flex;gap:8px;margin:4px 0 0}
.pw input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-size:15px}
.rem{display:flex;align-items:center;gap:8px;font-size:13.8px;color:var(--muted);margin-top:12px;cursor:pointer}
.rem input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.lerr{min-height:20px;font-size:13.8px;color:var(--s-closed);margin-top:10px}
.lnote{font-size:12.6px;color:var(--faint);margin-top:18px;line-height:1.5}
.sw{border:0;background:none;color:var(--faint)}
.sw:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gsync{font-size:12.5px;color:var(--faint);padding:10px 10px 8px;display:flex;align-items:center;gap:7px;line-height:1.3}
/* collapsible: smooth open/close for any section */
.coll{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .32s cubic-bezier(.2,.7,.2,1),opacity .24s ease;visibility:hidden}
.coll.open{grid-template-rows:1fr;opacity:1;visibility:visible}
.coll>div{overflow:hidden;min-height:0}
.coll:not(.open){transition:grid-template-rows .28s cubic-bezier(.4,0,.2,1),opacity .2s ease,visibility 0s .28s}
#logBody{overflow:hidden}
/* timeline step -> email */
.ve.tap,.tl .row.tap{cursor:pointer;border-radius:8px}
.ve.tap:hover .vx,.tl .row.tap:hover .x{color:var(--accent)}
.clip{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--faint)}
.clip svg.i,.fchip svg.i{width:13px;height:13px}
.mail .t1{font-size:17px}
.mail .t3{margin-top:4px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.fchip{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:8px 12px;border-radius:10px;background:var(--surface);color:var(--ink);font-size:13.8px;text-decoration:none}
.fchip:hover{background:var(--surface2)}
.fchip .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.fchip .fs{color:var(--faint);font-size:12.6px}
.mtext{white-space:pre-wrap;word-break:break-word;font-size:14.4px;line-height:1.55;color:var(--muted);margin:16px 0 18px;padding-top:14px;border-top:1px solid var(--line)}
.mail .link{display:inline-block;margin-right:16px;font-size:14px;text-decoration:none}
/* edit job, closed reason */
.why-c{color:var(--muted)}
.why-c.bad{color:var(--s-closed)}
.days.why-c{font-size:12.6px;text-align:right;white-space:nowrap;width:auto;min-width:64px}
.dh .sbtn.ed:hover{color:var(--ink)}
.edf{display:flex;flex-direction:column;gap:12px}
.edf.row2{flex-direction:row;align-items:center}
.edf label{display:flex;flex-direction:column;gap:6px;font-size:13.2px;color:var(--faint)}
.edf input,.edf select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;min-width:0}
.edf select{flex:1}
.edf .pbtn{align-self:flex-start}
/* settings */
.logh{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px}
.pbtn.sm{font-size:14px;padding:7px 14px;flex:none}
.logpad{padding:10px 0}
.logf{display:flex;align-items:center;gap:16px;padding:14px 0 4px;font-size:13.6px;color:var(--faint)}
.logf .link:disabled{color:var(--faint);opacity:.5;cursor:default}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15.5px;color:var(--muted);padding:6px 0}
.setrow input{width:72px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;text-align:center}
.logr{padding:13px 0;border-bottom:1px solid var(--line)}
.logr:last-child{border-bottom:0}
.logr .t1{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logr .did{font-size:14px;color:var(--ink);margin-top:4px}
.logr .did.off{color:var(--faint)}
.logr .t3{margin-top:3px}
.logr .did b,.logr .why b{font-weight:500;color:var(--muted)}
.logr .why{font-size:13.6px;color:var(--muted);margin-top:3px;line-height:1.4}
.gsync .glink{color:inherit;text-decoration:underline;text-underline-offset:3px}
.gdot{width:7px;height:7px;border-radius:50%;background:#3fb27f;flex:none}
.gdot.off{background:#666}.gdot.busy{background:#e0a84a;animation:gpulse 1.2s ease-in-out infinite}
@keyframes gpulse{50%{opacity:.35}}
a.acc{text-decoration:none;color:inherit}
</style></head>
<body>
<div class="app">
  <aside class="side">
    <button class="logo" data-switch title="Switch account">Job<span>Imp</span></button>
    <nav class="navl" id="nav">
      <button class="nv on" data-v="today"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Today</button>
      <button class="nv" data-v="alerts"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Found<span class="ct" id="foundCt"></span></button>
      <button class="nv" data-v="jobs"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7"/></svg>My jobs<span class="ct" id="jobsCt"></span></button>
      <button class="nv" data-v="interview"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Interviews</button>
      <button class="nv" data-v="stats"><svg class="i" viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Stats</button>
      <button class="nv" data-v="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
    </nav>
    <div class="sideh">Active jobs</div>
    <div class="sjobs" id="sjobs"></div>
    <div class="gsync" id="gsync" hidden></div>
    <div class="me"><div class="av sm" id="meAv">G</div><span id="meName">Gilad</span><button class="wa sw" data-switch title="Sign out and switch account">Switch</button></div>
  </aside>

  <main class="main" id="main"><div class="wrap" id="page"></div></main>

  <aside class="agent" id="agent">
    <div class="abar" id="abar"></div>
    <div id="threadBox" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
    <div class="sugg" id="sugg"></div>
    <form class="composer" id="composer">
      <input id="inp" placeholder="Ask or tell me anything" autocomplete="off" aria-label="Message the agent">
      <button type="button" class="micb" id="mic" aria-label="Speak"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="sendb" aria-label="Send"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </form>
  </aside>
</div>
<button class="atoggle" id="atoggle"><span class="spark"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>Ask the agent</button>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal"><div class="mbar"><div class="t1" id="mTitle"></div><button class="done" data-close>Close</button></div><div class="mbody" id="mBody"></div></div>
<div class="toast" id="toast"></div>
<div class="login" id="login" hidden>
  <div class="lbox">
    <div class="logo">Job<span>Imp</span></div>
    <h1>Choose an account</h1>
    <p>Pick the sample data or your real job search.</p>
    <button class="acc" data-acc="gilad"><div class="av">G</div><div class="txt"><div class="t1">Gilad</div><div class="t2">Real data from your Gmail and calendar</div></div><span class="chev">›</span></button>
    <div class="coll" id="pwColl"><div>
    <form class="pw" id="pwRow"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"><button class="pbtn pri">Sign in</button></form>
    <label class="rem" id="remRow"><input type="checkbox" id="rem" checked> Remember me on this device</label>
    </div></div>
    <div class="lerr" id="loginErr" role="status"></div>
    <a class="acc gbtn" id="gBtn" href="/api/google?start=1" hidden><div class="av g">G</div><div class="txt"><div class="t1">Continue with Google</div><div class="t2">Reads your job emails and calendar. Read only.</div></div><span class="chev">›</span></a>
    <button class="acc" data-acc="demo"><div class="av">D</div><div class="txt"><div class="t1">Demo account</div><div class="t2">Sample jobs, nothing real</div></div><span class="chev">›</span></button>
    <div class="lnote">Gmail and calendar are read only. JobImp never sends, edits or deletes anything.</div>
  </div>
</div>


<script src="app.js"></script>
</body></html>
